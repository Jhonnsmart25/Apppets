services:
  - type: web
    name: patitas-app
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BASE_URL
        sync: false
